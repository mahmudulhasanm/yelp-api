openapi: 3.0.3
info:
  title: Yelp API (Bright Data)
  description: >-
    Yelp business & review data via Bright Data's prebuilt Yelp Web Scraper API.
    Asynchronous job model: POST to trigger a collection, receive a job_id, then
    poll GET /result/{job_id} until the records are ready. Collection covers
    business details and reviews by business URL or alias.
  version: "2.0.0"
  contact:
    name: Mahmudul Hasan
    email: mahmudulhasan.dev@gmail.com
servers:
  - url: https://your-deployed-domain.example.com
    description: Production server (replace with your hosted API base URL)

tags:
  - name: Collect
    description: Trigger async Yelp collections
  - name: Result
    description: Poll job status and fetch results

paths:
  /business/collect:
    post:
      tags: [Collect]
      summary: Trigger a Yelp business-detail collection
      operationId: collectBusiness
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectInput" }
            example: { url: "https://www.yelp.com/biz/blue-bottle-coffee-san-francisco-8" }
      responses:
        "200":
          description: Job triggered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerResponse" }

  /reviews/collect:
    post:
      tags: [Collect]
      summary: Trigger a Yelp reviews collection
      description: Requires BRIGHTDATA_YELP_REVIEWS_DATASET to be configured.
      operationId: collectReviews
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectInput" }
            example: { url: "https://www.yelp.com/biz/blue-bottle-coffee-san-francisco-8", limit_per_input: 20 }
      responses:
        "200":
          description: Job triggered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerResponse" }

  /result/{job_id}:
    get:
      tags: [Result]
      summary: Poll job status and fetch results
      operationId: getResult
      parameters:
        - name: job_id
          in: path
          required: true
          description: job_id (snapshot_id) returned by a /collect call
          schema: { type: string, example: s_m4x7enmven8djfqak }
      responses:
        "200":
          description: Job status or results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultResponse" }

components:
  schemas:
    CollectInput:
      type: object
      description: Provide a single url/alias, or a batch via urls/aliases.
      properties:
        url: { type: string, example: "https://www.yelp.com/biz/blue-bottle-coffee-san-francisco-8" }
        alias: { type: string, example: "blue-bottle-coffee-san-francisco-8" }
        urls: { type: array, items: { type: string } }
        aliases: { type: array, items: { type: string } }
        limit_per_input: { type: integer, description: "Reviews only: max reviews per business", example: 20 }
    TriggerResponse:
      type: object
      properties:
        status: { type: string, example: triggered }
        type: { type: string, example: business }
        job_id: { type: string, example: s_m4x7enmven8djfqak }
        poll: { type: string, example: /result/s_m4x7enmven8djfqak }
    ResultResponse:
      type: object
      properties:
        status: { type: string, enum: [running, ready, failed, error], example: ready }
        job_id: { type: string }
        type: { type: string, example: business }
        results_count: { type: integer, example: 1 }
        records:
          type: array
          items: { type: object, additionalProperties: true }
          description: Bright Data structured Yelp output (business or review objects)
